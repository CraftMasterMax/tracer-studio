[project]
name = "tracer-studio"
version = "0.0.1"
description = "Tracer Studio — a keyboard-first parametric CAD for makers (Linux & Windows), free forever."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "moderngl>=5.12",
    "manifold3d>=3.5",
    "trimesh>=5.0",
    "scipy>=1.14",          # required by trimesh's export/merge paths
    "networkx>=3.0",        # trimesh's 3MF export graph ops
    "lxml>=5.0",            # trimesh's 3MF writer
    "rtree>=1.3",           # trimesh ray BVH — face picking in the viewport
    "shapely>=2.1",
    "pillow>=11.0",
    "ezdxf>=1.4",           # DXF profile import (M83)
    "svgelements>=1.9",     # SVG profile import (M83)
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-timeout>=2.4"]

[project.scripts]
tracer = "tracer.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracer*"]

[tool.setuptools.package-data]
"tracer.resources" = ["fonts/*.ttf", "fonts/*.txt", "*.png"]
"tracer.core" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
