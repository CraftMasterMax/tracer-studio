name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system GL deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install Forma
        run: pip install -e .[dev]
      - name: Test
        timeout-minutes: 25        # ubuntu baseline ~14 min: a stall gets
                                   #  KILLED (logs flush, culprit visible)
                                   #  instead of eating the 360-min budget
        env:
          QT_QPA_PLATFORM: offscreen
        # -u + -q + per-test dots stream progress; --timeout (pytest-timeout
        # is in the dev extra) makes a STALLED TEST name itself. The step
        # timeout makes everything else (collection / exit-time teardown)
        # die loudly on the runner.
        run: python -u -m pytest -q --timeout=300
