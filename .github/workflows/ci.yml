name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system GL deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install Forma
        run: pip install -e .[dev]
      - name: Test
        timeout-minutes: 25        # ubuntu baseline ~14 min: a stall gets
                                   #  KILLED (logs flush, culprit visible)
                                   #  instead of eating the 360-min budget
        env:
          QT_QPA_PLATFORM: offscreen
        # -v names every test as it COMPLETES: when a step dies on the
        # timeout, the last printed line pins the stall to ONE test.
        # --timeout makes a stalled TEST name itself; the step timeout
        # kills whatever no per-test timer can reach (native loops:
        # a modal exec() on an offscreen runner never returns).
        run: python -u -m pytest -v --timeout=300
