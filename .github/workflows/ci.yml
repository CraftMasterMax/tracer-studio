name: CI

on:
  push:
    branches: [main]
  pull_request:

# Concurrency (infra rung, 2026-11-14): superseded rungs must stop
# burning runner minutes. A CANCELLED run is NOT success - every
# fail-closed guard downstream stays closed, so this cannot lie.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 35           # job-level ceiling beside the step's 25
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 PINNED (infra rung, 2026-11-14, CI-WALLTIME.md):
        # ubuntu-latest migrates to 26.04 with completion planned
        # 2026-11-19 - a silent OS swap under our gate would be
        # indistinguishable from a broken rung. windows-latest stays
        # as-is: no deadline evidence there, and no unverified change.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache: pip caches the WHEEL/HTTP dir only (~/.cache/pip,
          # the action's own README, verbatim: "the action will cache
          # the global cache directory") - PySide6's payload wheels are
          # ~144 MB (essentials 84.3 + addons 59.2), nowhere near the
          # 10 GB budget. push is a TRUSTED cache-writing trigger by
          # the docs' table, so no cache-mode setting is needed.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system GL deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install Forma
        run: pip install -e .[dev]
      - name: Test
        timeout-minutes: 25        # ubuntu baseline ~14 min: a stall gets
                                   #  KILLED (logs flush, culprit visible)
                                   #  instead of eating the 360-min budget
        env:
          QT_QPA_PLATFORM: offscreen
        # -v names every test as it COMPLETES: when a step dies on the
        # timeout, the last printed line pins the stall to ONE test.
        # --timeout-method=thread KILLS a wedged test (signal cannot
        # interrupt a C call that never returns - attempts 4-5 saw 20
        # min of silence through a 300s SIGALRM budget); faulthandler
        # dumps ALL thread stacks from a watchdog every 60 s, so even
        # a permanent wedge shows its C-level frame.
        run: >-
          python -u -m pytest -v --timeout=300 --timeout-method=thread
          -p faulthandler -o faulthandler_timeout=60
